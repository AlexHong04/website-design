<!DOCTYPE html>
<html class="html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0" />
    <title>Look Travel - Activities, tour, attraction and things to do</title>
    <link href="./../css/layouts.css" rel="stylesheet" />
    <script src="./../js/header_footer.js"></script>
    <style>
      h1 {
        margin-top: 80px;
      }
      button {
        background-color: #4caf50;
        width: 100%;
        color: rgb(255, 255, 255);
        padding: 15px;
        margin: 10px 0px;
        border: none;
        cursor: pointer;
      }

      .cancelbtn {
        width: auto;
        padding: 10px 18px;
        margin: 10px 5px;
      }

      .header a:hover {
        background-color: #ddd;
        color: rgb(198, 82, 82);
        text-shadow: rgba(0, 0, 0, 0.5) 0px 15px 4px;
        transform: scale(1, 1) translateY(-15px);
      }

      h1 {
        color: #0077cc;
      }
    </style>
  </head>
  <body>
    <my-header></my-header>
    <center><h1>Register</h1></center>
    <form>
      <div class="container">
        <label>Username :</label>
        <input
          type="text"
          placeholder="Enter Username"
          name="username"
          required
        />
        <label>Password :</label>
        <input
          type="text"
          placeholder="Enter Password"
          name="password"
          required
        />
        <label>Repeat Password</label>
        <input
          type="text"
          placeholder="Enter Repeat Password"
          name="repeat password"
          required
        />
        <label>Phone number</label>
        <input
          type="text"
          placeholder="Enter Phone number"
          name="phone number"
          required
        />
        <label>E-mail</label>
        <input type="text" placeholder="Enter E-mail" name="E-mail" required />
        <a href="home.html"> <button type="submit">Login</button></a>
        <p>* If you want to return to the home page, please click the logo.</p>
      </div>
    </form>
    <my-footer></my-footer>
  </body>
</html>
