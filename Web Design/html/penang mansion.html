<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>[FREE] Dark Mansion</title>

    <link href="../css/Details.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script src="../js/header_footer.js"></script>
  </head>

  <body>
    <my-header></my-header>

    <div id="productTitle">
      <h1>
        Dark Mansion in Penang
        <span class="rating">
          <span class="star-logo">&#x2605;</span>
          4.5
        </span>
        <a
          href="https://www.google.com/maps/place/Dark+Mansion+-+3D+Glow+In+The+Dark+Museum/@5.4164205,100.3298547,17z/data=!3m1!4b1!4m6!3m5!1s0x304ac396b64fea5d:0x410d48058948c24e!8m2!3d5.4164152!4d100.3324296!16s%2Fg%2F11bzt0rrvn?entry=ttu
            "
          target="_blank"
          title="Dark Mansion"
          class="custom"
        >
          <i class="bi bi-geo-alt"></i>
        </a>
      </h1>
    </div>

    <div class="product">
      <img
        src="../images/dark mansion.jpg"
        alt="Dark Mansion"
        class="productImage"
      />
      <div class="productInfo">
        <p class="productDescription">
          Step into Penang's Dark Mansion and be mesmerized by its world-class
          3D glow-in-the-dark art pieces. A luminous experience that sparks
          wonder and imagination!
        </p>
        <div class="benefits">
          <div><i class="bi bi-check-circle"></i>Refund Protection</div>
          <div><i class="bi bi-check-circle"></i>1K+ Booked</div>
          <div><i class="bi bi-check-circle"></i>25 Review</div>
        </div>

        <div class="buttonContain">
          <div class="dateContain">
              <label for="datePicker">Choose A Date To Order</label>
              <i class="bi bi-clock"></i>
              <input type="date" id="datePicker" name="tripDate" class="customDate">
          </div>
          <button class="addtoCart" onclick="addToCart(this)">RM40.00</br>ADD TO CART</button>
        </div>
      </div>
    </div>

    <script src="../js/Details.js"></script>
    <my-footer></my-footer>
  </body>
</html>
